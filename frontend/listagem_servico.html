<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços | Vital Vet</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Nunito:wght@500&family=Quicksand:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="servicos-page">
  <nav class="menu-principal" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <details><summary>Cadastros</summary><div class="submenu submenu-operacoes">
      <details><summary>Tutores</summary><div class="submenu-interno"><a href="cadastro_tutor.html">Cadastrar</a><a href="listagem_tutor.html">Listar</a></div></details>
      <details><summary>Pacientes</summary><div class="submenu-interno"><a href="cadastro_animal.html">Cadastrar</a><a href="listagem_animal.html">Listar</a></div></details>
      <details><summary>Veterinários</summary><div class="submenu-interno"><a href="cadastro_veterinario.html">Cadastrar</a><a href="listagem_veterinario.html">Listar</a></div></details>
      <details><summary>Serviços</summary><div class="submenu-interno"><a href="cadastro_servico.html">Cadastrar</a><a href="listagem_servico.html">Listar</a></div></details>
      <details><summary>Atendimentos</summary><div class="submenu-interno"><a href="cadastro_atendimento.html">Cadastrar</a><a href="listagem_atendimento.html">Listar</a></div></details>
    </div></details>
  </nav>
  <main class="servicos-conteudo">
    <header class="cabecalho-pagina"><h1>Serviços cadastrados</h1></header>
    <div class="servicos-toolbar">
      <p id="mensagem" class="mensagem" role="status" aria-live="polite">Carregando serviços...</p>
      <a class="botao-link botao-principal" href="cadastro_servico.html"><span class="material-icons" aria-hidden="true">add</span>Novo serviço</a>
    </div>
    <div class="servicos-tabela-wrapper">
      <table>
        <thead><tr><th>ID</th><th>Serviço</th><th>Categoria</th><th>Valor (R$)</th><th class="acoes">Ações</th></tr></thead>
        <tbody id="tabelaServicos"></tbody>
      </table>
    </div>
  </main>
  <script>
    const tableBody = document.getElementById('tabelaServicos');
    const message = document.getElementById('mensagem');
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

    async function readJson(response) {
      if (!(response.headers.get('content-type') || '').includes('application/json')) throw new Error(`A API retornou uma resposta inesperada (HTTP ${response.status}).`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Falha na requisição (HTTP ${response.status}).`);
      return data;
    }

    function capitalize(text) {
      return text ? text.charAt(0).toLocaleUpperCase('pt-BR') + text.slice(1) : '';
    }

    function addAction(row, label, icon, href, className, action) {
      const control = action ? document.createElement('button') : document.createElement('a');
      control.className = `botao-acao ${className || ''}`.trim();
      control.setAttribute('aria-label', label);
      control.title = label;
      if (action) {
        control.type = 'button';
        control.addEventListener('click', action);
      } else {
        control.href = href;
      }
      const iconElement = document.createElement('span');
      iconElement.className = 'material-icons';
      iconElement.setAttribute('aria-hidden', 'true');
      iconElement.textContent = icon;
      control.append(iconElement, document.createTextNode(label));
      row.appendChild(control);
    }

    function renderRows(servicos) {
      tableBody.replaceChildren();
      if (!servicos.length) {
        const row = tableBody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.textContent = 'Nenhum serviço cadastrado.';
        return;
      }
      servicos.forEach((servico) => {
        const row = tableBody.insertRow();
        [
          servico.id,
          servico.nome,
          servico.categoria ? capitalize(servico.categoria) : 'Não informada',
          servico.valor === null || servico.valor === undefined ? 'Calculado no atendimento' : Number(servico.valor).toFixed(2)
        ].forEach((value) => {
          row.insertCell().textContent = String(value);
        });
        const actions = row.insertCell();
        actions.className = 'acoes';
        const query = `?id=${encodeURIComponent(servico.id)}`;
        addAction(actions, 'Detalhar', 'visibility', `detalhes_servico.html${query}`);
        addAction(actions, 'Editar', 'edit', `editar_servico.html${query}`, 'botao-principal');
        addAction(actions, 'Excluir', 'delete', null, 'botao-perigo', () => excluirServico(servico.id));
      });
    }

    async function carregarServicos() {
      message.className = 'mensagem';
      try {
        const servicos = await readJson(await fetch(`${API_BASE}/servicos`));
        if (!Array.isArray(servicos)) throw new Error('A API retornou uma lista de serviços inválida.');
        renderRows(servicos);
        message.textContent = servicos.length ? '' : 'Nenhum serviço cadastrado.';
      } catch (error) {
        message.classList.add('mensagem-erro');
        message.textContent = error instanceof TypeError
          ? 'Não foi possível conectar à API. Inicie o backend na porta 3000 e tente novamente.'
          : error.message;
      }
    }

    async function excluirServico(id) {
      if (!window.confirm('Deseja realmente excluir este serviço?')) return;
      try {
        const result = await readJson(await fetch(`${API_BASE}/servicos/${encodeURIComponent(id)}`, { method: 'DELETE' }));
        message.className = 'mensagem';
        message.textContent = result.message || 'Serviço excluído.';
        await carregarServicos();
      } catch (error) {
        message.classList.add('mensagem-erro');
        message.textContent = error.message;
      }
    }

    carregarServicos();
  </script>
</body>
</html>
