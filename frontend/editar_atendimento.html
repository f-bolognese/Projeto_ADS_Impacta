<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Atendimento | Vital Vet</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Nunito:wght@500&family=Quicksand:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="servicos-page">
  <nav class="menu-principal" aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <details><summary>Cadastros</summary><div class="submenu submenu-operacoes">
      <details><summary>Tutores</summary><div class="submenu-interno"><a href="cadastro_tutor.html">Cadastrar</a><a href="listagem_tutor.html">Listar</a></div></details>
      <details><summary>Pacientes</summary><div class="submenu-interno"><a href="cadastro_animal.html">Cadastrar</a><a href="listagem_animal.html">Listar</a></div></details>
      <details><summary>Veterinários</summary><div class="submenu-interno"><a href="cadastro_veterinario.html">Cadastrar</a><a href="listagem_veterinario.html">Listar</a></div></details>
      <details><summary>Serviços</summary><div class="submenu-interno"><a href="cadastro_servico.html">Cadastrar</a><a href="listagem_servico.html">Listar</a></div></details>
      <details><summary>Atendimentos</summary><div class="submenu-interno"><a href="cadastro_atendimento.html">Cadastrar</a><a href="listagem_atendimento.html">Listar</a></div></details>
    </div></details>
  </nav>
  <main class="servicos-conteudo">
    <header class="cabecalho-pagina"><h1>Editar Atendimento</h1></header>
    <form id="formAtendimento" class="servicos-formulario">
      <label for="animal_id">Paciente</label>
      <select id="animal_id" name="animal_id" required disabled><option value="">Carregando pacientes...</option></select>
      <label for="veterinario_id">Veterinário</label>
      <select id="veterinario_id" name="veterinario_id" required disabled><option value="">Carregando veterinários...</option></select>
      <label for="data">Data</label>
      <input type="date" id="data" name="data" required disabled>
      <label for="hora">Horário</label>
      <input type="time" id="hora" name="hora" step="1" disabled>
      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes" rows="4" disabled></textarea>
      <p id="totalAtual" class="mensagem">Total atual: R$ --</p>
      <p id="mensagem" class="mensagem" role="alert" aria-live="polite">Carregando atendimento...</p>
      <div class="servicos-botoes">
        <a class="botao-link" id="voltar" href="listagem_atendimento.html"><span class="material-icons" aria-hidden="true">arrow_back</span>Voltar</a>
        <button class="botao-principal" id="salvar" type="submit" disabled><span class="material-icons" aria-hidden="true">save</span>Salvar alterações</button>
      </div>
    </form>
  </main>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const form = document.getElementById('formAtendimento');
    const message = document.getElementById('mensagem');
    const animalSelect = document.getElementById('animal_id');
    const veterinarianSelect = document.getElementById('veterinario_id');
    const fields = [animalSelect, veterinarianSelect, document.getElementById('data'), document.getElementById('hora'), document.getElementById('observacoes')];
    const saveButton = document.getElementById('salvar');
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

    async function readJson(response) {
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Falha na requisição (HTTP ${response.status}).`);
      return data;
    }

    function fillSelect(select, rows, label, selectedId) {
      select.replaceChildren(new Option('Selecione...', ''));
      rows.forEach((row) => select.add(new Option(label(row), row.id)));
      select.value = String(selectedId ?? '');
      select.disabled = rows.length === 0;
    }

    async function loadAttendance() {
      if (!id || !/^\d+$/.test(id) || !Number.isSafeInteger(Number(id)) || Number(id) < 1) {
        message.classList.add('mensagem-erro');
        message.textContent = 'O identificador do atendimento é inválido.';
        return;
      }

      try {
        const [attendance, animals, veterinarians] = await Promise.all([
          fetch(`${API_BASE}/atendimentos/${encodeURIComponent(id)}`).then(readJson),
          fetch(`${API_BASE}/animais`).then(readJson),
          fetch(`${API_BASE}/veterinarios`).then(readJson)
        ]);
        fillSelect(animalSelect, animals, (animal) => `${animal.nome}${animal.especie ? ` (${animal.especie})` : ''}`, attendance.animal_id);
        fillSelect(veterinarianSelect, veterinarians, (veterinarian) => veterinarian.nome, attendance.veterinario_id);
        document.getElementById('data').value = attendance.data ? attendance.data.slice(0, 10) : '';
        document.getElementById('hora').value = attendance.hora ? attendance.hora.slice(0, 8) : '';
        document.getElementById('observacoes').value = attendance.observacoes || '';
        document.getElementById('totalAtual').textContent = `Total atual: R$ ${Number(attendance.valor_total ?? attendance.total ?? 0).toFixed(2)}`;
        fields.forEach((field) => { field.disabled = false; });
        saveButton.disabled = false;
        document.getElementById('voltar').href = `detalhes_atendimento.html?id=${encodeURIComponent(id)}`;
        message.textContent = '';
        form.dataset.valorTotal = String(Number(attendance.valor_total ?? attendance.total ?? 0));
      } catch (error) {
        message.classList.add('mensagem-erro');
        message.textContent = error instanceof TypeError
          ? 'Não foi possível conectar à API. Inicie o backend na porta 3000 e tente novamente.'
          : error.message;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.className = 'mensagem';
      message.textContent = '';
      const payload = {
        animal_id: Number(animalSelect.value),
        veterinario_id: Number(veterinarianSelect.value),
        data: document.getElementById('data').value,
        hora: document.getElementById('hora').value || null,
        observacoes: document.getElementById('observacoes').value.trim() || null,
        valor_total: Number(form.dataset.valorTotal || 0)
      };
      try {
        await readJson(await fetch(`${API_BASE}/atendimentos/${encodeURIComponent(id)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }));
        window.location.href = `detalhes_atendimento.html?id=${encodeURIComponent(id)}`;
      } catch (error) {
        message.classList.add('mensagem-erro');
        message.textContent = error instanceof TypeError
          ? 'Não foi possível conectar à API. Inicie o backend na porta 3000 e tente novamente.'
          : error.message;
      }
    });

    loadAttendance();
  </script>
</body>
</html>
